[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ddm-emulator"
version = "0.1.0"
description = "Fast density-profile emulator for self-gravitating decaying-dark-matter halos"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Anna Bencke" },
]
dependencies = ["numpy>=1.20", "matplotlib>=3.5"]

[project.optional-dependencies]
# The emulators themselves run on numpy alone at inference; matplotlib is pulled
# in by default so the example notebook works out of the box. scipy is needed
# only if the trained model uses a Matern smoothness nu outside {0.5, 1.5, 2.5}.
extras = ["scipy>=1.7"]

[project.urls]
"Paper" = "https://arxiv.org/abs/XXXX.XXXXX"
"Archive" = "https://doi.org/10.5281/zenodo.XXXXXXX"

[tool.setuptools]
packages = ["ddm_emulator"]